<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Published applications</title>
<style>
  :root {
    --ink: #0b0c0c;
    --muted: #505a5f;
    --line: #b1b4b6;
    --page: #ffffff;
    --panel: #f3f2f1;
    --link: #1d70b8;
    --good: #00703c;
    --warn: #d4351c;
    --edited: #fd0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #f3f2f1; --muted: #b1b4b6; --line: #505a5f;
      --page: #0b0c0c; --panel: #1a1c1d; --link: #5ca7e8;
      --good: #4ba97a; --warn: #f4796b;
    }
  }
  :root[data-theme="dark"] {
    --ink: #f3f2f1; --muted: #b1b4b6; --line: #505a5f;
    --page: #0b0c0c; --panel: #1a1c1d; --link: #5ca7e8;
    --good: #4ba97a; --warn: #f4796b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  }
  header {
    border-bottom: 4px solid var(--ink); padding: 16px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  input, select, button {
    font: inherit; padding: 8px 10px; border: 2px solid var(--ink);
    background: var(--page); color: var(--ink); border-radius: 0;
  }
  input { flex: 1 1 240px; min-width: 0; }
  button { cursor: pointer; background: var(--ink); color: var(--page); border-color: var(--ink); }
  button.secondary { background: var(--page); color: var(--ink); }
  button.danger { background: var(--warn); border-color: var(--warn); color: #fff; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
  tr.row:hover { background: var(--panel); }
  .ref { font-weight: 600; }
  .tag {
    display: inline-block; font-size: 0.75rem; padding: 2px 6px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .tag.edited { border-color: var(--ink); background: var(--edited); color: #0b0c0c; }
  .desc { color: var(--muted); font-size: 0.9rem; }

  .pager { display: flex; gap: 8px; align-items: center; margin-top: 16px; }
  .pager .count { color: var(--muted); font-size: 0.9rem; margin-left: auto; }

  dialog {
    border: 4px solid var(--ink); background: var(--page); color: var(--ink);
    width: min(760px, 94vw); padding: 0;
  }
  dialog::backdrop { background: rgba(0,0,0,0.5); }
  .dialog-head { padding: 16px; border-bottom: 1px solid var(--line); }
  .dialog-body { padding: 16px; }
  .dialog-foot { padding: 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  textarea {
    width: 100%; min-height: 320px; font: 13px/1.5 ui-monospace, Consolas, monospace;
    padding: 10px; border: 2px solid var(--ink); background: var(--page); color: var(--ink);
  }
  .history { font-size: 0.85rem; color: var(--muted); margin-top: 12px; }
  .message { padding: 10px; margin-bottom: 12px; border-left: 4px solid var(--good); background: var(--panel); }
  .message.bad { border-left-color: var(--warn); }
  .empty { padding: 32px 8px; color: var(--muted); }
  @media (max-width: 640px) { .hide-small { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Published applications</h1>
  <div class="sub">The gold layer. Editing here never changes what the council sent.</div>
</header>

<main>
  <div id="message" hidden></div>

  <div class="controls">
    <input id="search" type="search" placeholder="Search by reference or address" autocomplete="off">
    <select id="council"><option value="">All councils</option></select>
    <select id="sort">
      <option value="reference">Reference</option>
      <option value="published_at">Published</option>
      <option value="updated_at">Last edited</option>
    </select>
    <select id="order"><option value="asc">Ascending</option><option value="desc">Descending</option></select>
  </div>

  <table>
    <thead>
      <tr>
        <th>Reference</th>
        <th class="hide-small">Address</th>
        <th>Type</th>
        <th class="hide-small">Decision</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" hidden>Nothing published yet. Run <code>dpr publish</code>.</div>

  <div class="pager">
    <button class="secondary" id="prev">Previous</button>
    <button class="secondary" id="next">Next</button>
    <span class="count" id="count"></span>
  </div>
</main>

<dialog id="editor">
  <form method="dialog" id="editorForm">
    <div class="dialog-head">
      <strong id="editorTitle"></strong>
      <div class="sub" id="editorSub"></div>
    </div>
    <div class="dialog-body">
      <textarea id="record" spellcheck="false"></textarea>
      <div class="history" id="history"></div>
    </div>
    <div class="dialog-foot">
      <button value="save" id="save">Save changes</button>
      <button value="cancel" class="secondary" formnovalidate>Cancel</button>
      <button value="delete" class="danger" id="remove" formnovalidate>Unpublish</button>
    </div>
  </form>
</dialog>

<script>
const state = { page: 1, size: 20, total: 0, current: null };
const editor = document.getElementById("editor");

// Who is editing. Real sign in comes later; until then the name is asked for once and
// sent with every change, so the history is still attributable.
function editorName() {
  let name = localStorage.getItem("dpr-editor");
  if (!name) {
    name = prompt("Your email, so changes can be attributed:") || "";
    if (name) localStorage.setItem("dpr-editor", name);
  }
  return name;
}

function say(text, bad) {
  const box = document.getElementById("message");
  box.textContent = text;
  box.className = bad ? "message bad" : "message";
  box.hidden = false;
  setTimeout(() => { box.hidden = true; }, 4000);
}

async function load() {
  const params = new URLSearchParams({
    page: state.page,
    size: state.size,
    sort: document.getElementById("sort").value,
    order: document.getElementById("order").value,
  });
  const council = document.getElementById("council").value;
  if (council) params.set("council", council);

  const response = await fetch("/private/applications?" + params);
  const body = await response.json();
  state.total = body.total;

  const search = document.getElementById("search").value.trim().toLowerCase();
  const rows = body.applications.filter((item) => {
    if (!search) return true;
    const haystack = [item.reference, item.detail?.address, item.detail?.description].join(" ");
    return haystack.toLowerCase().includes(search);
  });

  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  for (const item of rows) {
    const detail = item.detail || {};
    const tr = document.createElement("tr");
    tr.className = "row";
    tr.innerHTML = `
      <td>
        <div class="ref">${escape(item.reference)}</div>
        <div class="desc">${escape(item.council)}${item.edited ? ' <span class="tag edited">edited</span>' : ""}</div>
      </td>
      <td class="hide-small desc">
        ${escape(detail.address || "")}
        <div>${escape((detail.description || "").slice(0, 90))}</div>
      </td>
      <td>
        <span class="tag">${escape(item.record?.applicationType || "")}</span>
      </td>
      <td class="hide-small desc">${escape(detail.decision || "")}</td>
      <td><button class="secondary" data-open>Open</button></td>`;
    tr.querySelector("[data-open]").addEventListener("click", () => open(item));
    tbody.appendChild(tr);
  }

  document.getElementById("empty").hidden = body.total !== 0;
  const from = (state.page - 1) * state.size + 1;
  const to = Math.min(state.page * state.size, body.total);
  document.getElementById("count").textContent =
    body.total ? `${from} to ${to} of ${body.total}` : "";
  document.getElementById("prev").disabled = state.page <= 1;
  document.getElementById("next").disabled = state.page >= body.pages;
}

function escape(value) {
  return String(value ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function open(item) {
  state.current = item;
  document.getElementById("editorTitle").textContent = item.reference;
  document.getElementById("editorSub").textContent =
    `${item.council}${item.edited ? " · edited here" : " · as the council sent it"}`;
  document.getElementById("record").value = JSON.stringify(item.record, null, 2);

  const path = `/private/applications/${item.council}/${item.reference}`;
  const history = await (await fetch(path + "/history")).json();
  document.getElementById("history").textContent = history.length
    ? "Changes: " + history.map((h) => `${h.action} by ${h.by} at ${h.at.slice(0, 16).replace("T", " ")}`).join("; ")
    : "No changes yet.";

  editor.showModal();
}

document.getElementById("editorForm").addEventListener("submit", async (event) => {
  const action = event.submitter?.value;
  const item = state.current;
  if (!item || action === "cancel") return;

  const name = editorName();
  if (!name) { say("A name is needed before a change can be saved.", true); return; }
  const path = `/private/applications/${item.council}/${item.reference}`;

  if (action === "delete") {
    if (!confirm(`Unpublish ${item.reference}? It stays in silver and bronze.`)) return;
    const response = await fetch(path, { method: "DELETE", headers: { "X-Edited-By": name } });
    say(response.ok ? `${item.reference} unpublished.` : "Could not unpublish.", !response.ok);
  } else {
    let record;
    try {
      record = JSON.parse(document.getElementById("record").value);
    } catch (error) {
      say("That is not valid JSON, so nothing was saved.", true);
      return;
    }
    const response = await fetch(path, {
      method: "PUT",
      headers: { "Content-Type": "application/json", "X-Edited-By": name },
      body: JSON.stringify(record),
    });
    say(response.ok ? `${item.reference} saved.` : "Could not save.", !response.ok);
  }
  load();
});

document.getElementById("prev").addEventListener("click", () => { state.page--; load(); });
document.getElementById("next").addEventListener("click", () => { state.page++; load(); });
for (const id of ["sort", "order", "council"]) {
  document.getElementById(id).addEventListener("change", () => { state.page = 1; load(); });
}
document.getElementById("search").addEventListener("input", () => load());

(async function start() {
  const body = await (await fetch("/private/applications?size=200")).json();
  const councils = [...new Set(body.applications.map((item) => item.council))].sort();
  const select = document.getElementById("council");
  for (const council of councils) {
    const option = document.createElement("option");
    option.value = option.textContent = council;
    select.appendChild(option);
  }
  load();
})();
</script>
</body>
</html>

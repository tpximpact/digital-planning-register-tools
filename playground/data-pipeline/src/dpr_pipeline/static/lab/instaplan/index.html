<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>InstaPlan</title>
    <style>
      :root {
        --like: #ed4956;
        --ink: #262626;
        --soft: #737373;
        --line: #dbdbdb;
        --link: #00376b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          Helvetica, Arial, sans-serif;
        background: #fafafa;
        color: var(--ink);
        font-size: 14px;
      }
      #wrap {
        max-width: 470px;
        margin: 0 auto;
        background: #fff;
        min-height: 100dvh;
        padding-bottom: 64px;
        border-inline: 1px solid #efefef;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: #fff;
        border-bottom: 1px solid var(--line);
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Pacifico', 'Segoe Script', 'Brush Script MT', cursive;
        font-size: 27px;
      }
      .logo svg {
        width: 26px;
        height: 26px;
      }
      header a,
      header button {
        color: var(--ink);
        font-size: 24px;
        text-decoration: none;
        background: none;
        border: 0;
        cursor: pointer;
      }
      #stories {
        display: flex;
        gap: 14px;
        padding: 14px 14px 12px;
        overflow-x: auto;
        border-bottom: 1px solid #efefef;
        scrollbar-width: none;
      }
      .story {
        flex: none;
        display: grid;
        justify-items: center;
        gap: 5px;
        width: 68px;
        font-size: 12px;
        background: none;
        border: 0;
        cursor: pointer;
        color: var(--ink);
      }
      .story i {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        padding: 3px;
        border: 2px solid var(--like);
        display: grid;
        place-items: center;
      }
      .story i b {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: #efefef;
        display: grid;
        place-items: center;
        font-size: 20px;
      }
      .story.seen i {
        border-color: var(--line);
      }
      .story.on span {
        font-weight: 700;
      }
      article {
        border-bottom: 1px solid #efefef;
        padding-bottom: 6px;
        margin-bottom: 8px;
      }
      .head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
      }
      .head .av {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #efefef;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
        border: 1px solid var(--line);
      }
      .head b {
        font-size: 14px;
      }
      .head small {
        display: block;
        color: var(--soft);
        font-size: 12px;
      }
      .head .flag {
        margin-left: auto;
        color: var(--like);
        font-size: 12px;
        font-weight: 600;
      }
      .pic {
        position: relative;
        aspect-ratio: 1;
        background: #eee;
        overflow: hidden;
        user-select: none;
      }
      .pic svg.plan {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .pic svg.pop {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 96px;
        height: 96px;
        margin: -48px 0 0 -48px;
        fill: #fff;
        opacity: 0;
        pointer-events: none;
        filter: drop-shadow(0 2px 10px rgb(0 0 0 / 0.4));
      }
      .pic svg.pop.go {
        animation: pop 0.9s ease-out;
      }
      @keyframes pop {
        0% {
          transform: scale(0);
          opacity: 0;
        }
        15% {
          transform: scale(1.2);
          opacity: 1;
        }
        30% {
          transform: scale(0.95);
        }
        45% {
          transform: scale(1);
          opacity: 1;
        }
        80% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(0.9);
          opacity: 0;
        }
      }
      .actions {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 8px 12px 4px;
      }
      .actions button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        display: grid;
      }
      .actions svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: var(--ink);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .actions .like.on svg {
        fill: var(--like);
        stroke: var(--like);
        animation: beat 0.3s;
      }
      .actions .save {
        margin-left: auto;
      }
      .actions .save.on svg {
        fill: var(--ink);
      }
      @keyframes beat {
        40% {
          transform: scale(1.25);
        }
      }
      .meta {
        padding: 0 12px;
        line-height: 1.4;
      }
      .meta .likes {
        font-weight: 700;
        margin-bottom: 4px;
      }
      .meta p b {
        margin-right: 5px;
      }
      .meta .more {
        color: var(--soft);
        background: none;
        border: 0;
        padding: 4px 0 0;
        font: inherit;
        cursor: pointer;
        display: block;
      }
      .meta time {
        display: block;
        margin-top: 5px;
        font-size: 10px;
        letter-spacing: 0.2px;
        color: var(--soft);
        text-transform: uppercase;
      }
      .thread {
        padding: 6px 12px 0;
        display: grid;
        gap: 7px;
      }
      .thread p b {
        margin-right: 5px;
      }
      .thread pre {
        background: #f6f6f6;
        border: 1px solid #efefef;
        border-radius: 6px;
        padding: 8px;
        font-size: 11px;
        overflow: auto;
        white-space: pre;
      }
      .thread .raw {
        color: var(--soft);
        background: none;
        border: 0;
        font: inherit;
        text-align: left;
        padding: 0;
        cursor: pointer;
      }
      .thread .spec {
        color: #0a7d3c;
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(100%, 470px);
        height: 52px;
        background: #fff;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 5;
      }
      nav svg {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: var(--ink);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      nav .count {
        font-weight: 700;
        font-size: 13px;
      }
      .empty {
        padding: 60px 30px;
        text-align: center;
        color: var(--soft);
      }
      .empty h2 {
        color: var(--ink);
        margin-bottom: 6px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 70px;
        transform: translateX(-50%);
        background: #262626;
        color: #fff;
        padding: 9px 16px;
        border-radius: 8px;
        z-index: 9;
      }
      #toast[hidden] {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .pic svg.pop.go,
        .like.on svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <header>
        <a href="../" aria-label="Back to the lab">&#8249;</a>
        <div class="logo" aria-label="InstaPlan">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect
              x="3"
              y="3"
              width="26"
              height="26"
              rx="7"
              fill="none"
              stroke="#262626"
              stroke-width="2.4"
            />
            <path
              d="M9 21V13l7-5 7 5v8z"
              fill="none"
              stroke="#262626"
              stroke-width="2.2"
              stroke-linejoin="round"
            />
            <path
              d="M14 21v-5h4v5"
              fill="none"
              stroke="#262626"
              stroke-width="2.2"
            />
          </svg>
          InstaPlan
        </div>
        <button id="who" aria-label="Choose a council">&#9881;</button>
      </header>
      <div id="stories"></div>
      <main id="feed"></main>
      <nav aria-label="Main">
        <svg viewBox="0 0 24 24" aria-label="Home">
          <path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" />
        </svg>
        <svg viewBox="0 0 24 24" aria-label="Search">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-4-4" />
        </svg>
        <svg viewBox="0 0 24 24" aria-label="New">
          <rect x="3" y="3" width="18" height="18" rx="5" />
          <path d="M12 8v8M8 12h8" />
        </svg>
        <span class="count" id="count">0 approved</span>
      </nav>
    </div>
    <script src="../lab.js"></script>
    <script>
      ;(async () => {
        const { el } = Lab
        const feed = document.getElementById('feed'),
          stories = document.getElementById('stories'),
          count = document.getElementById('count')
        const cards = await Lab.load()
        const liked = new Set(),
          seen = new Set()
        const palette = {
          paper: '#f4f1e8',
          ink: '#4a5a4f',
          site: '#ed4956',
          road: '#ffffff',
          line: '#e5e0d2'
        }
        const icons = {
          heart:
            '<svg viewBox="0 0 24 24"><path d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 0 0-7.4 7.4L12 21.8l8.8-8.8a5.2 5.2 0 0 0 0-7.4z"/></svg>',
          bubble:
            '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 20.5l1.7-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>',
          send: '<svg viewBox="0 0 24 24"><path d="m22 3-9 18-2.4-8L3 10.6z"/><path d="M22 3 10.6 13"/></svg>',
          save: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>'
        }
        const tick = () => {
          count.textContent = `${liked.size} approved`
        }

        // The council "stories" switch which council is shown.
        const names = [...new Set([Lab.council(), 'camden', 'barnet'])]
        names.forEach((name) => {
          const on = name === Lab.council()
          stories.append(
            el(
              'button',
              {
                class: 'story' + (on ? ' on' : ''),
                onclick: () => Lab.setCouncil(name)
              },
              el('i', {}, el('b', {}, name.slice(0, 1).toUpperCase())),
              el('span', {}, name)
            )
          )
        })
        stories.append(
          el(
            'button',
            {
              class: 'story',
              onclick: () => {
                const n = prompt('Council')
                if (n) Lab.setCouncil(n.trim().toLowerCase())
              }
            },
            el('i', {}, el('b', {}, '+')),
            el('span', {}, 'Other')
          )
        )
        document.getElementById('who').onclick = () =>
          stories.lastElementChild.click()

        function post(card) {
          const likeBtn = el('button', {
            class: 'like',
            'aria-label': 'Approve',
            'aria-pressed': 'false'
          })
          likeBtn.innerHTML = icons.heart
          const pop = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'svg'
          )
          pop.setAttribute('viewBox', '0 0 24 24')
          pop.setAttribute('class', 'pop')
          pop.innerHTML =
            '<path d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 0 0-7.4 7.4L12 21.8l8.8-8.8a5.2 5.2 0 0 0 0-7.4z"/>'
          const likes = el(
            'div',
            { class: 'likes' },
            'Waiting for a first approval'
          )
          const thread = el('div', { class: 'thread', hidden: true })

          const set = (on) => {
            on ? liked.add(card.reference) : liked.delete(card.reference)
            likeBtn.classList.toggle('on', on)
            likeBtn.setAttribute('aria-pressed', on)
            likes.textContent = on
              ? `Approved by ${Lab.editor()}`
              : 'Waiting for a first approval'
            tick()
          }
          const approve = () => {
            if (liked.has(card.reference)) return
            set(true)
            pop.classList.remove('go')
            void pop.getBoundingClientRect()
            pop.classList.add('go')
            Lab.buzz(18)
            Lab.approve(card).catch(() => {
              set(false)
              Lab.toast('Could not save that approval')
            })
          }
          likeBtn.onclick = () => {
            if (liked.has(card.reference)) {
              set(false)
              Lab.unapprove(card)
            } else approve()
          }

          const rows = Lab.thread(card)
          const open = async () => {
            thread.hidden = !thread.hidden
            if (thread.hidden || thread.childElementCount) return
            thread.append(
              ...rows.map(([who, text]) => el('p', {}, el('b', {}, who), text))
            )
            const raw = el('pre', { hidden: true }, Lab.rawJson(card))
            thread.append(
              el(
                'button',
                {
                  class: 'raw',
                  onclick: () => {
                    raw.hidden = !raw.hidden
                  }
                },
                'View the record as JSON'
              ),
              raw
            )
            const ok = await Lab.specCheck(card)
            if (ok !== null)
              thread.prepend(
                el(
                  'p',
                  { class: 'spec' },
                  el('b', {}, 'spec'),
                  ok
                    ? 'Matches the OpenAPI spec'
                    : 'Does not match the OpenAPI spec'
                )
              )
          }
          const more = el(
            'button',
            { class: 'more', onclick: open },
            `View all ${rows.length} comments`
          )

          const pic = el('div', { class: 'pic', ondblclick: approve })
          pic.innerHTML = Lab.plan(card, palette).replace(
            '<svg ',
            '<svg class="plan" '
          )
          pic.append(pop)
          // A double tap on a touch screen, which does not always raise dblclick.
          let last = 0
          pic.addEventListener('pointerup', (event) => {
            if (event.pointerType !== 'touch') return
            const now = Date.now()
            if (now - last < 320) approve()
            last = now
          })

          const save = el('button', {
            class: 'save',
            'aria-label': 'Save for later',
            onclick: (event) => {
              event.currentTarget.classList.toggle('on')
            }
          })
          save.innerHTML = icons.save
          const comment = el('button', {
            'aria-label': 'Comments',
            onclick: open
          })
          comment.innerHTML = icons.bubble
          const share = el('button', {
            'aria-label': 'Copy the reference',
            onclick: () => {
              navigator.clipboard?.writeText(card.reference)
              Lab.toast('Reference copied')
            }
          })
          share.innerHTML = icons.send

          const node = el(
            'article',
            {},
            el(
              'div',
              { class: 'head' },
              el(
                'div',
                { class: 'av' },
                card.council.slice(0, 1).toUpperCase()
              ),
              el(
                'div',
                {},
                el('b', {}, card.council),
                el('small', {}, card.address)
              ),
              card.flagged ? el('span', { class: 'flag' }, 'Needs a look') : ''
            ),
            pic,
            el('div', { class: 'actions' }, likeBtn, comment, share, save),
            el(
              'div',
              { class: 'meta' },
              likes,
              el('p', {}, el('b', {}, card.reference), card.description),
              more,
              thread,
              el(
                'time',
                {},
                [card.stage, card.status].filter(Boolean).join(' · ') ||
                  card.type
              )
            )
          )
          return node
        }

        if (!cards.length)
          feed.append(
            el(
              'div',
              { class: 'empty' },
              el('h2', {}, 'You are all caught up'),
              el('p', {}, `Nothing is waiting in ${Lab.council()}.`)
            )
          )
        cards.forEach((card) => feed.append(post(card)))
      })()
    </script>
  </body>
</html>

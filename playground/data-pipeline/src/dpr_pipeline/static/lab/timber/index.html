<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tim-ber</title>
    <style>
      :root {
        --coral: #fd5068;
        --orange: #ff7854;
        --like: #2fd897;
        --nope: #ff4458;
        --later: #2ea8ff;
        --rewind: #f5b800;
        --ink: #21262e;
        --soft: #656e7b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f0f2f4;
        color: var(--ink);
        display: flex;
        justify-content: center;
        overscroll-behavior: none;
      }
      #phone {
        width: min(100%, 440px);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: #fff;
        position: relative;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 18px 8px;
      }
      header a,
      header button {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        color: #b0b7c1;
        background: none;
        border: 0;
        border-radius: 50%;
        font-size: 22px;
        text-decoration: none;
        cursor: pointer;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 6px;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -1px;
        background: linear-gradient(135deg, var(--coral), var(--orange));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .logo svg {
        width: 28px;
        height: 28px;
      }
      #deck {
        position: relative;
        flex: 1;
        margin: 4px 10px 0;
        min-height: 0;
      }
      .card {
        position: absolute;
        inset: 0;
        border-radius: 12px;
        overflow: hidden;
        background: #ddd;
        box-shadow: 0 2px 12px rgb(0 0 0 / 0.18);
        touch-action: none;
        user-select: none;
        will-change: transform;
        transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.3, 1);
        cursor: grab;
      }
      .card.drag {
        transition: none;
        cursor: grabbing;
      }
      .card svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .shade {
        position: absolute;
        inset: auto 0 0 0;
        height: 55%;
        background: linear-gradient(transparent, rgb(0 0 0 / 0.78));
      }
      .info {
        position: absolute;
        inset: auto 0 0 0;
        padding: 18px 18px 20px;
        color: #fff;
      }
      .info h2 {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.5px;
        display: flex;
        align-items: baseline;
        gap: 10px;
      }
      .info h2 small {
        font-size: 22px;
        font-weight: 400;
      }
      .where {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
        font-size: 15px;
        opacity: 0.92;
      }
      .about {
        margin-top: 8px;
        font-size: 15px;
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .tags span {
        border: 1.5px solid rgb(255 255 255 / 0.7);
        border-radius: 99px;
        padding: 3px 11px;
        font-size: 13px;
        font-weight: 600;
      }
      .tags .flag {
        background: rgb(255 68 88 / 0.9);
        border-color: transparent;
      }
      .more {
        position: absolute;
        right: 14px;
        bottom: 22px;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 0;
        background: none;
        color: #fff;
        font-size: 22px;
        cursor: pointer;
      }
      .stamp {
        position: absolute;
        top: 34px;
        padding: 2px 12px;
        border: 5px solid;
        border-radius: 8px;
        font-size: 38px;
        font-weight: 800;
        letter-spacing: 1px;
        opacity: 0;
      }
      .stamp.like {
        left: 22px;
        color: var(--like);
        transform: rotate(-16deg);
      }
      .stamp.nope {
        right: 22px;
        color: var(--nope);
        transform: rotate(16deg);
      }
      .stamp.later {
        left: 50%;
        top: 40%;
        color: var(--later);
        transform: translateX(-50%) rotate(-6deg);
        font-size: 34px;
      }
      #buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        padding: 12px 0 calc(14px + env(safe-area-inset-bottom));
      }
      #buttons button {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: 0;
        background: #fff;
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.18);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: transform 0.12s;
      }
      #buttons button:active {
        transform: scale(0.88);
      }
      #buttons button.big {
        width: 64px;
        height: 64px;
      }
      #buttons svg {
        width: 52%;
        height: 52%;
        fill: none;
        stroke-width: 3.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
        gap: 10px;
        padding: 30px;
        color: var(--soft);
      }
      .empty h2 {
        color: var(--ink);
      }
      .empty button {
        justify-self: center;
        margin-top: 8px;
        padding: 12px 26px;
        border: 0;
        border-radius: 99px;
        color: #fff;
        font-weight: 700;
        background: linear-gradient(135deg, var(--coral), var(--orange));
        cursor: pointer;
      }
      #sheet {
        position: absolute;
        inset: 0;
        background: rgb(0 0 0 / 0.45);
        display: flex;
        align-items: flex-end;
        z-index: 5;
      }
      #sheet[hidden] {
        display: none;
      }
      #sheet section {
        background: #fff;
        width: 100%;
        max-height: 82%;
        overflow: auto;
        border-radius: 18px 18px 0 0;
        padding: 14px 18px 26px;
      }
      #sheet h3 {
        font-size: 17px;
        text-align: center;
        padding-bottom: 12px;
        border-bottom: 1px solid #eceff2;
      }
      .c {
        display: flex;
        gap: 10px;
        padding: 10px 0;
        font-size: 15px;
        line-height: 1.35;
      }
      .c i {
        flex: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font: 700 13px system-ui;
        color: #fff;
        background: linear-gradient(135deg, var(--coral), var(--orange));
        font-style: normal;
      }
      .c b {
        display: block;
        font-size: 13px;
        color: var(--soft);
        font-weight: 600;
      }
      details {
        margin-top: 8px;
      }
      summary {
        color: var(--soft);
        font-size: 14px;
        cursor: pointer;
      }
      pre {
        margin-top: 8px;
        padding: 10px;
        background: #f4f6f8;
        border-radius: 8px;
        font-size: 12px;
        overflow: auto;
        white-space: pre;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 120px;
        transform: translateX(-50%);
        background: var(--ink);
        color: #fff;
        padding: 9px 16px;
        border-radius: 99px;
        font-size: 14px;
        z-index: 9;
      }
      #toast[hidden] {
        display: none;
      }
      #council {
        border: 0;
        background: none;
        font: inherit;
        color: var(--soft);
        text-align: center;
        width: 100px;
      }
      @media (prefers-reduced-motion: reduce) {
        .card {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="phone">
      <header>
        <a href="../" aria-label="Back to the lab">&#8249;</a>
        <div class="logo" aria-label="Tim-ber">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fd5068" />
                <stop offset="1" stop-color="#ff7854" />
              </linearGradient>
            </defs>
            <circle
              cx="16"
              cy="16"
              r="14"
              fill="none"
              stroke="url(#g)"
              stroke-width="3"
            />
            <circle
              cx="16"
              cy="16"
              r="9"
              fill="none"
              stroke="url(#g)"
              stroke-width="3"
            />
            <circle cx="16" cy="16" r="4" fill="url(#g)" />
          </svg>
          tim-ber
        </div>
        <button id="who" aria-label="Choose a council">&#9881;</button>
      </header>
      <div id="deck"></div>
      <div id="buttons">
        <button id="b-undo" aria-label="Undo" style="width: 44px; height: 44px">
          <svg viewBox="0 0 24 24" stroke="#f5b800">
            <path d="M9 14 4 9l5-5" />
            <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
          </svg>
        </button>
        <button id="b-nope" class="big" aria-label="Flag for later">
          <svg viewBox="0 0 24 24" stroke="#ff4458">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
        <button
          id="b-later"
          aria-label="Look at it again later"
          style="width: 44px; height: 44px"
        >
          <svg viewBox="0 0 24 24" stroke="#2ea8ff">
            <path
              d="m12 3 2.7 5.8 6.3.8-4.6 4.4 1.2 6.3L12 17.2 6.4 20.3l1.2-6.3L3 9.6l6.3-.8z"
            />
          </svg>
        </button>
        <button id="b-like" class="big" aria-label="Approve">
          <svg viewBox="0 0 24 24" stroke="#2fd897">
            <path
              d="M20.8 5.6a5.2 5.2 0 0 0-7.4 0L12 7l-1.4-1.4a5.2 5.2 0 0 0-7.4 7.4L12 21.8l8.8-8.8a5.2 5.2 0 0 0 0-7.4z"
            />
          </svg>
        </button>
      </div>
      <div id="sheet" hidden>
        <section role="dialog" aria-modal="true" aria-label="Details"></section>
      </div>
    </div>
    <script src="../lab.js"></script>
    <script>
      ;(async () => {
        const { el } = Lab
        const deck = document.getElementById('deck'),
          sheet = document.getElementById('sheet')
        const stack = await Lab.load()
        let cards = [...stack],
          history = [],
          approved = 0
        const palette = {
          paper: '#eef2ee',
          ink: '#33403a',
          site: '#fd5068',
          road: '#ffffff',
          line: '#d8dfd9'
        }

        const label = (c) =>
          (c.type || '')
            .replace(/^pp\.full\./, '')
            .replace(/^pp\./, '')
            .replace(/\./g, ' ')
        function build(card) {
          const node = el('div', { class: 'card' })
          node.innerHTML = Lab.plan(card, palette)
          node.append(
            el('div', { class: 'shade' }),
            el('div', { class: 'stamp like' }, 'APPROVE'),
            el('div', { class: 'stamp nope' }, 'FLAG'),
            el('div', { class: 'stamp later' }, 'LATER'),
            el(
              'div',
              { class: 'info' },
              el('h2', {}, card.reference, el('small', {}, card.status || '')),
              el('div', { class: 'where' }, '⌖ ', card.address),
              el('div', { class: 'about' }, card.description),
              el(
                'div',
                { class: 'tags' },
                el('span', {}, label(card)),
                card.decision ? el('span', {}, card.decision) : '',
                card.flagged
                  ? el('span', { class: 'flag' }, 'Needs a look')
                  : ''
              )
            ),
            el(
              'button',
              {
                class: 'more',
                'aria-label': 'More details',
                onpointerdown: (event) => event.stopPropagation(),
                onclick: (event) => {
                  event.stopPropagation()
                  open(card)
                }
              },
              'ⓘ'
            )
          )
          node.card = card
          return node
        }

        function render() {
          deck.replaceChildren()
          if (!cards.length) {
            deck.append(
              el(
                'div',
                { class: 'empty' },
                el('h2', {}, 'That is everyone for now'),
                el(
                  'p',
                  {},
                  `${approved} approved. Nothing else is waiting in ${Lab.council()}.`
                ),
                el('button', { onclick: () => location.reload() }, 'Look again')
              )
            )
            return
          }
          cards
            .slice(0, 3)
            .reverse()
            .forEach((card, index, list) => {
              const depth = list.length - 1 - index,
                node = build(card)
              node.style.transform = `scale(${1 - depth * 0.04}) translateY(${
                depth * 10
              }px)`
              deck.append(node)
            })
          wire(deck.lastElementChild)
        }

        const stamps = (node, dx, dy) => {
          node.querySelector('.like').style.opacity = Math.min(
            1,
            Math.max(0, dx / 90)
          )
          node.querySelector('.nope').style.opacity = Math.min(
            1,
            Math.max(0, -dx / 90)
          )
          node.querySelector('.later').style.opacity = Math.min(
            1,
            Math.max(0, -dy / 90 - Math.abs(dx) / 200)
          )
        }

        function wire(node) {
          let x0,
            y0,
            dx = 0,
            dy = 0,
            down = false
          node.addEventListener('pointerdown', (event) => {
            down = true
            x0 = event.clientX
            y0 = event.clientY
            node.classList.add('drag')
            node.setPointerCapture(event.pointerId)
          })
          node.addEventListener('pointermove', (event) => {
            if (!down) return
            dx = event.clientX - x0
            dy = event.clientY - y0
            node.style.transform = `translate(${dx}px, ${dy}px) rotate(${
              dx / 18
            }deg)`
            stamps(node, dx, dy)
          })
          const end = () => {
            if (!down) return
            down = false
            node.classList.remove('drag')
            if (dx > 110) return leave('like')
            if (dx < -110) return leave('nope')
            if (dy < -110) return leave('later')
            node.style.transform = ''
            stamps(node, 0, 0)
            dx = dy = 0
          }
          node.addEventListener('pointerup', end)
          node.addEventListener('pointercancel', end)
        }

        function leave(kind) {
          const node = deck.lastElementChild
          if (!node || !node.card) return
          const card = node.card,
            away = {
              like: [600, 0, 24],
              nope: [-600, 0, -24],
              later: [0, -800, 0]
            }[kind]
          node.classList.remove('drag')
          node.style.transform = `translate(${away[0]}px, ${away[1]}px) rotate(${away[2]}deg)`
          node.querySelector(`.${kind}`).style.opacity = 1
          Lab.buzz()
          cards.shift()
          if (kind === 'like') {
            approved++
            Lab.approve(card).catch(() =>
              Lab.toast('Could not save that approval')
            )
          }
          if (kind === 'later') cards.push(card)
          history.push({ card, kind })
          setTimeout(render, 240)
        }

        function undo() {
          const last = history.pop()
          if (!last) return Lab.toast('Nothing to undo')
          if (last.kind === 'later')
            cards = cards.filter((c) => c !== last.card)
          if (last.kind === 'like') {
            approved--
            Lab.unapprove(last.card)
          }
          cards.unshift(last.card)
          render()
        }

        async function open(card) {
          const body = sheet.firstElementChild
          body.replaceChildren(
            el('h3', {}, `${card.reference} comments`),
            ...Lab.thread(card).map(([who, text]) =>
              el(
                'div',
                { class: 'c' },
                el('i', {}, who.slice(0, 2).toUpperCase()),
                el('div', {}, el('b', {}, '@' + who), text)
              )
            ),
            el(
              'details',
              {},
              el('summary', {}, 'Show the record as JSON'),
              el('pre', {}, Lab.rawJson(card))
            )
          )
          sheet.hidden = false
          const ok = await Lab.specCheck(card)
          if (ok !== null)
            body
              .querySelector('h3')
              .after(
                el(
                  'div',
                  { class: 'c' },
                  el('i', {}, 'OK'),
                  el(
                    'div',
                    {},
                    el('b', {}, '@spec'),
                    ok
                      ? 'Matches the OpenAPI spec'
                      : 'Does not match the OpenAPI spec'
                  )
                )
              )
        }
        sheet.addEventListener('click', (event) => {
          if (event.target === sheet) sheet.hidden = true
        })

        document.getElementById('b-like').onclick = () => leave('like')
        document.getElementById('b-nope').onclick = () => leave('nope')
        document.getElementById('b-later').onclick = () => leave('later')
        document.getElementById('b-undo').onclick = undo
        document.getElementById('who').onclick = () => {
          const name = prompt('Council', Lab.council())
          if (name) Lab.setCouncil(name.trim().toLowerCase())
        }
        addEventListener('keydown', (event) => {
          if (event.target.matches('input, textarea')) return
          if (event.key === 'Escape') sheet.hidden = true
          if (event.key === 'ArrowRight') leave('like')
          if (event.key === 'ArrowLeft') leave('nope')
          if (event.key === 'ArrowUp') leave('later')
          if (event.key === 'z') undo()
        })
        render()
      })()
    </script>
  </body>
</html>

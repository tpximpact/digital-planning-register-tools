[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpr-data-pipeline"
version = "0.1.0"
description = "Portable bronze, silver and gold pipeline for planning data"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "fsspec>=2024.2",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
s3 = ["s3fs>=2024.2"]
azure = ["adlfs>=2024.2"]
dev = ["pytest>=8.0", "ruff>=0.4", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
dpr = "dpr_pipeline.cli:main"

[tool.setuptools.package-data]
dpr_pipeline = ["data/*.json", "data/schemas/*.json", "static/*.html", "static/*.css", "static/lab/*", "static/lab/*/*", "mappings/*.yaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
